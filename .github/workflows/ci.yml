name: CI
on:
  push:
    branches:
      - main
      - release-*
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - release-*
    types: [opened, synchronize]

jobs:

  build:
    name: build and test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      BUILDER_NAME: "GitHub Actions"
      BUILDER_EMAIL: noreply@actions.github.com

    steps:

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.1'
      id: go

    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install -y make sed
        choco install -y pandoc shellcheck

    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install pandoc shellcheck
        
    - name: Install dependencies (Linux/Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt update
        sudo apt install -y pandoc shellcheck

    - name: lint, build and run unit tests
      run: make check
      shell: bash

